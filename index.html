<!DOCTYPE html>

<head>
  <meta charset="utf-8" />
  <!-- SPDX-License-Identifier: GPL-2.0-only -->

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden !important;
      background-color: #000000;
      font-family: "Courier New", monospace;
      position: fixed;
      top: 0;
      left: 0;
      margin: 0;
      padding: 0;
    }

    body::-webkit-scrollbar {
      display: none !important;
    }

    html {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    #terminal {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      position: fixed;
      top: 0;
      left: 0;
      overflow: hidden !important;
      margin: 0;
      padding: 0;
    }

    #terminal * {
      box-sizing: border-box;
    }

    #terminal .xterm {
      width: 100% !important;
      height: 100% !important;
      padding: 5px;
      overflow: hidden !important;
    }

    #terminal .xterm-screen {
      width: 100% !important;
      height: 100% !important;
    }

    #terminal .xterm-viewport {
      overflow-y: hidden !important;
    }

    /* Hide all other content */
    h1,
    pre,
    article,
    p {
      display: none !important;
      visibility: hidden !important;
    }
  </style>

  <!-- Stupid workaround to trick the browser it gets COOP/COEP headers, enabling window.crossOriginIsolated. -->
  <!-- Needed when serving this site using GitHub Pages as it does not set the headers we want. -->
  <!-- Read more: https://github.com/gzuidhof/coi-serviceworker -->
  <script>
    window.coi = { coepCredentialless: () => false };
  </script>
  <script src="coi-serviceworker.min.js"></script>

  <!-- Pyodide - Python for WebAssembly (Latest: 0.29.0 with Python 3.13) -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.0/full/pyodide.js"></script>

  <script>
    // Append ?v=-1 to the URL to cache-bust smug browsers that ignore your Cache-Control headers.
    let wasm_linux_version = parseInt(
      new URLSearchParams(document.location.search).get("v") || 1
    );
    wasm_linux_version =
      wasm_linux_version < 0 ? +new Date() : wasm_linux_version;
    document.write(
      "<l" +
        'ink rel="stylesheet" href="bright.css?v=' +
        wasm_linux_version +
        '">'
    );
    document.write(
      "<l" +
        'ink rel="stylesheet" href="xterm.css?v=' +
        wasm_linux_version +
        '">'
    );
    document.write(
      "<scr" + 'ipt src="linux.js?v=' + wasm_linux_version + '"></scr' + "ipt>"
    );
    document.write(
      "<scr" + 'ipt src="xterm.js?v=' + wasm_linux_version + '"></scr' + "ipt>"
    );

    document.addEventListener(
      "DOMContentLoaded",
      async () => {
        const term = new Terminal({
          theme: { background: "#000000", foreground: "#00FF00" },
          fontSize: 12,
          fontFamily: "Courier New, monospace",
          cursorBlink: true,
        });
        term.open(document.getElementById("terminal"));

        // Calculate terminal dimensions to fill the screen
        const resizeTerminal = () => {
          const terminalElement = document.getElementById("terminal");
          const width = terminalElement.clientWidth;
          const height = terminalElement.clientHeight;

          // Calculate cols and rows based on font size
          const cols = Math.floor(width / 7.2); // Approximate char width for 12px font
          const rows = Math.floor(height / 17); // Approximate line height for 12px font

          term.resize(cols, rows);
        };

        // Initial resize after terminal is ready
        setTimeout(resizeTerminal, 100);

        // Resize when window size changes
        window.addEventListener("resize", resizeTerminal);
        const log = (text) =>
          term.write(("\x1B[2m" + text + "\x1B[0m\n").replaceAll("\n", "\r\n"));
        const console_write = (data) => term.write(data); // Pre-decoded UTF-8 data.

        // Memory and freeze detection
        let lastActivityTime = Date.now();
        let memoryWarningShown = false;

        function updateActivity() {
          lastActivityTime = Date.now();
        }

        // Monitor system health
        setInterval(() => {
          // Check memory usage if available
          if (performance.memory) {
            const usedMemory = performance.memory.usedJSHeapSize / 1048576; // MB
            const totalMemory = performance.memory.jsHeapSizeLimit / 1048576; // MB
            const memoryPercent = (usedMemory / totalMemory) * 100;

            // Warn if memory usage is high
            if (memoryPercent > 80 && !memoryWarningShown) {
              console_write(
                "\r\n\x1B[33m⚠ High memory usage detected (" +
                  Math.round(memoryPercent) +
                  "%)\x1B[0m\r\n"
              );
              console_write(
                "\x1B[33m  Tip: Reload page if system becomes sluggish (Ctrl+R)\x1B[0m\r\n\r\n"
              );
              memoryWarningShown = true;
            }

            // Reset warning if memory drops
            if (memoryPercent < 70) {
              memoryWarningShown = false;
            }
          }
        }, 10000); // Check every 10 seconds

        // Global Python state
        let pyodide = null;
        let pythonReady = false;
        let pythonLoading = false;
        let pythonMode = false;
        let pythonBuffer = "";

        // Initialize Pyodide in the background (non-blocking)
        async function initPython() {
          if (pythonLoading || pythonReady) {
            return; // Already loading or loaded
          }

          pythonLoading = true;
          try {
            log("Loading Python environment (this may take 10-30 seconds)...");
            log("You can continue using Linux commands while Python loads.");

            // Add a timeout to prevent infinite hanging
            const loadWithTimeout = Promise.race([
              loadPyodide({
                indexURL: "https://cdn.jsdelivr.net/pyodide/v0.29.0/full/",
              }),
              new Promise((_, reject) =>
                setTimeout(
                  () => reject(new Error("Pyodide loading timeout (60s)")),
                  60000
                )
              ),
            ]);

            pyodide = await loadWithTimeout;

            // Redirect Python stdout to terminal
            await pyodide.runPythonAsync(`
    import sys
    from io import StringIO
    sys.stdout = StringIO()
    sys.stderr = StringIO()
                `);

            pythonReady = true;
            pythonLoading = false;
            log("✓ Python 3.13 ready! Type 'python' or 'python3' to start.");
            log("  Type 'exit()' to return to Linux shell.");

            // Install commonly used packages in background
            log("⏳ Installing Python packages (requests, numpy)...");
            try {
              await pyodide.loadPackage("micropip");
              const micropip = pyodide.pyimport("micropip");

              // Install packages
              await micropip.install("requests");
              await micropip.install("numpy");

              log("✓ Packages installed: requests, numpy");
              log(
                "  Try: import requests; r = requests.get('https://api.github.com')"
              );

              // Setup Python filesystem helpers for persistent storage
              await pyodide.runPythonAsync(`
import js
import json

class BrowserStorage:
    """Helper class for persistent file storage using browser localStorage"""
    
    @staticmethod
    def save_file(filename, content):
        """Save content to browser storage"""
        js.localStorage.setItem(f"pyfile_{filename}", content)
        return f"Saved {filename} to persistent storage"
    
    @staticmethod
    def load_file(filename):
        """Load content from browser storage"""
        content = js.localStorage.getItem(f"pyfile_{filename}")
        if content is None:
            raise FileNotFoundError(f"{filename} not found in storage")
        return content
    
    @staticmethod
    def list_files():
        """List all saved files"""
        keys = []
        for i in range(js.localStorage.length):
            key = js.localStorage.key(i)
            if key.startswith("pyfile_"):
                keys.append(key.replace("pyfile_", ""))
        return keys
    
    @staticmethod
    def delete_file(filename):
        """Delete file from storage"""
        js.localStorage.removeItem(f"pyfile_{filename}")
        return f"Deleted {filename}"

# Make it easily accessible
storage = BrowserStorage()
              `);

              log("✓ Python filesystem helpers loaded");
              log("  Use: storage.save_file('data.txt', 'content')");
              log("       storage.load_file('data.txt')");
            } catch (error) {
              log("⚠ Package installation failed: " + error.message);
              log(
                "  Python still works, but some packages may be unavailable."
              );
            }
          } catch (error) {
            pythonLoading = false;
            log("✗ Python initialization failed: " + error.message);
            log(
              "  Tip: Try reloading the page or check your internet connection."
            );
            console.error("Python init error:", error);
          }
        }

        // GitHub Cloud Storage Configuration (FREE - 1-5 GB)
        // Uses your current repository for cloud file storage
        const GITHUB_OWNER = "Haubby"; // Your GitHub username
        const GITHUB_REPO = "linux-wasm"; // This repository
        const GITHUB_BRANCH = "storage"; // Separate branch for user files
        const GITHUB_TOKEN = ""; // Optional: Personal Access Token for private repos
        // Generate token at: https://github.com/settings/tokens (repo scope)
        // Leave empty for public repos (60 requests/hour limit)

        let githubStorageReady = false;

        // Initialize GitHub Cloud Storage
        async function initGitHubStorage() {
          try {
            // Check if the storage branch exists
            const branchUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/branches/${GITHUB_BRANCH}`;
            const headers = GITHUB_TOKEN
              ? { Authorization: `token ${GITHUB_TOKEN}` }
              : {};

            const response = await fetch(branchUrl, { headers });

            if (response.status === 404) {
              log("⚠ GitHub storage branch not found.");
              log(
                `  Create branch '${GITHUB_BRANCH}' in your repo for cloud storage.`
              );
              log("  Using local storage only.");
              return;
            }

            if (response.ok) {
              githubStorageReady = true;
              log("✓ GitHub Cloud Storage connected! (FREE - up to 5 GB)");
              log(`  Repository: ${GITHUB_OWNER}/${GITHUB_REPO}`);
              log(`  Branch: ${GITHUB_BRANCH}`);
            } else {
              log("⚠ GitHub API error: " + response.status);
              log("  Using local storage only.");
            }
          } catch (error) {
            log("⚠ GitHub Storage connection failed: " + error.message);
            log("  Continuing with local storage only.");
          }
        }

        // GitHub storage helper functions
        async function githubUploadFile(filename, content) {
          const path = `files/${filename}`;
          const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`;
          const headers = {
            "Content-Type": "application/json",
          };

          if (GITHUB_TOKEN) {
            headers["Authorization"] = `token ${GITHUB_TOKEN}`;
          }

          // Check if file exists to get SHA (required for updates)
          let sha = null;
          try {
            const checkResponse = await fetch(url + `?ref=${GITHUB_BRANCH}`, {
              headers,
            });
            if (checkResponse.ok) {
              const data = await checkResponse.json();
              sha = data.sha;
            }
          } catch (e) {
            // File doesn't exist, that's okay
          }

          // Upload or update file
          const body = {
            message: `Upload ${filename}`,
            content: btoa(unescape(encodeURIComponent(content))), // Base64 encode
            branch: GITHUB_BRANCH,
          };

          if (sha) {
            body.sha = sha; // Required for updates
          }

          const response = await fetch(url, {
            method: "PUT",
            headers: headers,
            body: JSON.stringify(body),
          });

          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.message || "GitHub upload failed");
          }

          return `Uploaded ${filename} to GitHub Cloud Storage`;
        }

        async function githubDownloadFile(filename) {
          const path = `files/${filename}`;
          const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`;
          const headers = GITHUB_TOKEN
            ? { Authorization: `token ${GITHUB_TOKEN}` }
            : {};

          const response = await fetch(url, { headers });

          if (!response.ok) {
            throw new Error(`File not found: ${filename}`);
          }

          const data = await response.json();
          // Decode from base64
          return decodeURIComponent(escape(atob(data.content)));
        }

        async function githubListFiles() {
          const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/files?ref=${GITHUB_BRANCH}`;
          const headers = GITHUB_TOKEN
            ? { Authorization: `token ${GITHUB_TOKEN}` }
            : {};

          const response = await fetch(url, { headers });

          if (!response.ok) {
            if (response.status === 404) {
              return []; // Directory doesn't exist yet
            }
            throw new Error("Failed to list files");
          }

          const data = await response.json();
          return data.map((item) => item.name);
        }

        async function githubDeleteFile(filename) {
          const path = `files/${filename}`;
          const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`;
          const headers = {
            "Content-Type": "application/json",
          };

          if (GITHUB_TOKEN) {
            headers["Authorization"] = `token ${GITHUB_TOKEN}`;
          }

          // Get file SHA (required for deletion)
          const getResponse = await fetch(url + `?ref=${GITHUB_BRANCH}`, {
            headers,
          });
          if (!getResponse.ok) {
            throw new Error(`File not found: ${filename}`);
          }

          const data = await getResponse.json();

          // Delete file
          const deleteResponse = await fetch(url, {
            method: "DELETE",
            headers: headers,
            body: JSON.stringify({
              message: `Delete ${filename}`,
              sha: data.sha,
              branch: GITHUB_BRANCH,
            }),
          });

          if (!deleteResponse.ok) {
            throw new Error("Failed to delete file");
          }

          return `Deleted ${filename} from GitHub Cloud Storage`;
        }

        // Execute Python code
        async function executePython(code) {
          if (!pythonReady) {
            if (pythonLoading) {
              return "Python is still loading, please wait...\r\n";
            }
            return "Python is not available. Try reloading the page.\r\n";
          }

          try {
            // Clear previous output
            await pyodide.runPythonAsync(`
    sys.stdout = StringIO()
    sys.stderr = StringIO()
                `);

            // Run the code (use async version for better performance)
            let result = await pyodide.runPythonAsync(code);

            // Get stdout and stderr
            let stdout = await pyodide.runPythonAsync("sys.stdout.getvalue()");
            let stderr = await pyodide.runPythonAsync("sys.stderr.getvalue()");

            let output = "";
            if (stdout) output += stdout;
            if (stderr) output += stderr;

            // If there's a return value and no stdout, show it (like Python REPL)
            if (result !== undefined && result !== null && !stdout && !stderr) {
              output += String(result);
            }

            return output ? output + "\r\n" : "";
          } catch (error) {
            // Format Python errors nicely
            const errorMsg = error.message || String(error);
            return "Python Error: " + errorMsg + "\r\n";
          }
        }

        // This is needed for SharedArrayBuffer on modern browsers.
        if (!window.crossOriginIsolated) {
          log(
            "Error: Server did not set correct cross-origin-isolated headers."
          );
          console_write(
            "\r\n\r\n\r\n  IF YOU SEE THIS ERROR RELOADING THE PAGE MAY HELP.\r\n\r\n\r\n"
          );
          // Keep going though, it might work in some environments...
        }

        // Start loading Python in parallel with Linux boot (non-blocking)
        // Use setTimeout to ensure it doesn't block the main thread
        setTimeout(() => {
          initPython().catch((err) => {
            console.error("Failed to initialize Python:", err);
          });
        }, 2000); // Wait 2 seconds after Linux starts booting

        // Initialize GitHub Cloud Storage
        setTimeout(() => {
          initGitHubStorage();
        }, 3000); // Wait 3 seconds to not block Python loading

        try {
          const worker_url = "linux-worker.js?v=" + wasm_linux_version;

          const vmlinux = await WebAssembly.compileStreaming(
            fetch("vmlinux.wasm?v=" + wasm_linux_version)
          );

          // Boot on 3 CPUs, we will bring up more later on as needed.
          const boot_cmdline =
            "maxcpus=3 nohz_full=0,2-63 root=/dev/ram0 rootfstype=ramfs init=/init console=hvc console=ttyS0";

          const initrd_request = await fetch(
            "initramfs.cpio.gz?v=" + wasm_linux_version
          );
          if (!initrd_request.ok) {
            throw new Error(
              "Failed to fetch initrd from server, status: " +
                initrd_request.status
            );
          }
          const initrd = await initrd_request.arrayBuffer();

          const os = await linux(
            worker_url,
            vmlinux,
            boot_cmdline,
            initrd,
            log,
            console_write
          );

          // Setup virtual filesystem with persistent storage
          log("Setting up virtual filesystem (500MB)...");
          try {
            // Create a persistent storage directory using IndexedDB-backed filesystem
            // This gives us a virtual disk that persists across sessions
            const VIRTUAL_FS_SIZE = 500 * 1024 * 1024; // 500MB configurable

            // Note: The actual filesystem is managed by the Linux kernel in Wasm
            // We're using the existing MEMFS which can grow as needed
            // Files created in /tmp or user directories will persist in browser memory

            log("✓ Virtual filesystem ready (500MB available)");
            log("  Create files with: echo 'data' > /tmp/myfile.txt");
            log(
              "  Files persist during session, use Python for long-term storage"
            );
            log("");
            log("💡 Tips:");
            log("  • Type 'restart' or press Ctrl+R if system freezes");
            log("  • Type 'meminfo' to check memory usage");
            log("  • Type 'help-storage' for all available commands");
          } catch (error) {
            log("⚠ Virtual filesystem setup had issues: " + error.message);
          }

          // Intercept terminal input to handle Python mode
          let inputBuffer = "";
          term.onData(async (data) => {
            updateActivity(); // Track user activity

            // Check for Ctrl+Alt+R (system restart shortcut)
            if (data === "\x12") {
              // Ctrl+R
              console_write("\r\n\x1B[33m🔄 Reloading page...\x1B[0m\r\n");
              setTimeout(() => window.location.reload(), 500);
              return;
            }

            // In Python mode, accumulate into pythonBuffer
            if (pythonMode) {
              if (data !== "\r" && data !== "\n") {
                pythonBuffer += data;
              }
            } else {
              // Not in Python mode - accumulate command to check for 'python'
              if (data !== "\r" && data !== "\n") {
                inputBuffer += data;
              }
            }

            // Handle Enter key (check for python command)
            if (data === "\r" || data === "\n") {
              const command = inputBuffer.trim();

              // Check if user is starting Python (only when not already in Python mode)
              if (
                !pythonMode &&
                (command === "python" || command === "python3")
              ) {
                if (pythonReady) {
                  pythonMode = true;
                  pythonBuffer = "";
                  console_write(
                    "\r\nPython 3.13 (main, Nov 2025) [Pyodide 0.29.0] on WebAssembly\r\n"
                  );
                  console_write(
                    'Type "help", "copyright" for more information.\r\n'
                  );
                  console_write(">>> ");
                  inputBuffer = "";
                  return; // Don't send to Linux
                } else if (pythonLoading) {
                  console_write(
                    "\r\nPython is still loading, please wait...\r\n"
                  );
                  inputBuffer = "";
                  os.key_input("\r"); // Get new prompt
                  return;
                } else {
                  console_write(
                    "\r\nPython failed to load. Try reloading the page.\r\n"
                  );
                  inputBuffer = "";
                  os.key_input("\r"); // Get new prompt
                  return;
                }
              }

              // Check for curl/wget commands (HTTP fetch)
              if (
                !pythonMode &&
                (command.startsWith("curl ") || command.startsWith("wget "))
              ) {
                const isCurl = command.startsWith("curl ");
                const url = command.split(" ")[1];

                if (!url) {
                  console_write("\r\nUsage: curl <url> or wget <url>\r\n");
                  inputBuffer = "";
                  os.key_input("\r");
                  return;
                }

                console_write("\r\nFetching " + url + "...\r\n");

                try {
                  const response = await fetch(url);
                  if (!response.ok) {
                    console_write(
                      "Error: HTTP " +
                        response.status +
                        " " +
                        response.statusText +
                        "\r\n"
                    );
                  } else {
                    const text = await response.text();
                    console_write(text + "\r\n");
                  }
                } catch (error) {
                  console_write("Error: " + error.message + "\r\n");
                  console_write(
                    "Note: CORS may block some requests. Use Python requests for better compatibility.\r\n"
                  );
                }

                inputBuffer = "";
                os.key_input("\r");
                return;
              }

              // Check for download command (save file to local machine)
              if (!pythonMode && command.startsWith("download ")) {
                const filename = command.substring(9).trim();

                if (!filename) {
                  console_write("\r\nUsage: download <filename>\r\n");
                  console_write(
                    "Example: download myfile.txt (downloads from Python storage)\r\n"
                  );
                  inputBuffer = "";
                  os.key_input("\r");
                  return;
                }

                console_write("\r\nDownloading '" + filename + "'...\r\n");

                try {
                  if (pythonReady) {
                    // Load file from Python storage
                    const content = await pyodide.runPythonAsync(`
try:
    storage.load_file('${filename}')
except FileNotFoundError:
    ''
                    `);

                    if (content) {
                      // Create download link
                      const blob = new Blob([content], { type: "text/plain" });
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement("a");
                      a.href = url;
                      a.download = filename;
                      document.body.appendChild(a);
                      a.click();
                      document.body.removeChild(a);
                      URL.revokeObjectURL(url);

                      console_write(
                        "✓ File downloaded to your browser's download folder\r\n"
                      );
                    } else {
                      console_write(
                        "Error: File '" +
                          filename +
                          "' not found in storage\r\n"
                      );
                      console_write(
                        "Use: storage.list_files() to see available files\r\n"
                      );
                    }
                  } else {
                    console_write(
                      "⚠ Python not ready. Cannot download files.\r\n"
                    );
                  }
                } catch (error) {
                  console_write("Error: " + error.message + "\r\n");
                }

                inputBuffer = "";
                os.key_input("\r");
                return;
              }

              // Check for upload command (load file from local machine)
              if (!pythonMode && command === "upload") {
                console_write("\r\nOpening file picker...\r\n");

                // Create hidden file input
                const fileInput = document.createElement("input");
                fileInput.type = "file";
                fileInput.style.display = "none";
                document.body.appendChild(fileInput);

                fileInput.onchange = async (e) => {
                  const file = e.target.files[0];
                  if (file) {
                    console_write(
                      "Reading " +
                        file.name +
                        " (" +
                        file.size +
                        " bytes)...\r\n"
                    );
                    try {
                      const text = await file.text();

                      // Save to Python storage
                      if (pythonReady) {
                        await pyodide.runPythonAsync(`
storage.save_file('${file.name}', '''${text.replace(/'/g, "\\'")}''')
                        `);
                        console_write(
                          "✓ File saved as '" +
                            file.name +
                            "' in Python storage\r\n"
                        );
                        console_write(
                          "Load it with: storage.load_file('" +
                            file.name +
                            "')\r\n"
                        );
                      } else {
                        console_write(
                          "⚠ Python not ready. File read but not saved.\r\n"
                        );
                      }
                    } catch (error) {
                      console_write(
                        "Error reading file: " + error.message + "\r\n"
                      );
                    }
                    os.key_input("\r");
                  }
                  document.body.removeChild(fileInput);
                };

                fileInput.click();
                inputBuffer = "";
                return;
              }

              // Check for GitHub cloud storage commands
              if (!pythonMode && command.startsWith("git-upload ")) {
                const filename = command.substring(11).trim();

                if (!filename) {
                  console_write("\r\nUsage: git-upload <filename>\r\n");
                  console_write(
                    "Uploads file from local storage to GitHub Cloud Storage (FREE)\r\n"
                  );
                  inputBuffer = "";
                  os.key_input("\r");
                  return;
                }

                if (!githubStorageReady) {
                  console_write(
                    "\r\n⚠ GitHub Cloud Storage not configured\r\n"
                  );
                  console_write("See: help-storage for setup instructions\r\n");
                  inputBuffer = "";
                  os.key_input("\r");
                  return;
                }

                console_write("\r\nUploading to GitHub...\r\n");

                try {
                  if (pythonReady) {
                    const content = await pyodide.runPythonAsync(`
try:
    storage.load_file('${filename}')
except FileNotFoundError:
    ''
                    `);

                    if (content) {
                      await githubUploadFile(filename, content);
                      console_write(
                        "✓ File uploaded to GitHub Cloud Storage (FREE)\r\n"
                      );
                    } else {
                      console_write(
                        "Error: File '" +
                          filename +
                          "' not found in local storage\r\n"
                      );
                    }
                  } else {
                    console_write(
                      "⚠ Python not ready. Cannot upload files.\r\n"
                    );
                  }
                } catch (error) {
                  console_write("Error: " + error.message + "\r\n");
                  console_write(
                    "Hint: You may need a GitHub token for write access.\r\n"
                  );
                }

                inputBuffer = "";
                os.key_input("\r");
                return;
              }

              if (!pythonMode && command.startsWith("git-download ")) {
                const filename = command.substring(13).trim();

                if (!filename) {
                  console_write("\r\nUsage: git-download <filename>\r\n");
                  console_write(
                    "Downloads file from GitHub Cloud Storage to local storage\r\n"
                  );
                  inputBuffer = "";
                  os.key_input("\r");
                  return;
                }

                if (!githubStorageReady) {
                  console_write(
                    "\r\n⚠ GitHub Cloud Storage not configured\r\n"
                  );
                  inputBuffer = "";
                  os.key_input("\r");
                  return;
                }

                console_write("\r\nDownloading from GitHub...\r\n");

                try {
                  const content = await githubDownloadFile(filename);

                  if (pythonReady && content) {
                    await pyodide.runPythonAsync(`
storage.save_file('${filename}', '''${content.replace(/'/g, "\\'")}''')
                    `);
                    console_write(
                      "✓ File downloaded from GitHub and saved locally\r\n"
                    );
                    console_write(
                      "Access with: storage.load_file('" + filename + "')\r\n"
                    );
                  } else {
                    console_write(
                      "✓ Downloaded: " + content.length + " bytes\r\n"
                    );
                  }
                } catch (error) {
                  console_write("Error: " + error.message + "\r\n");
                }

                inputBuffer = "";
                os.key_input("\r");
                return;
              }

              if (!pythonMode && command === "git-list") {
                if (!githubStorageReady) {
                  console_write(
                    "\r\n⚠ GitHub Cloud Storage not configured\r\n"
                  );
                  inputBuffer = "";
                  os.key_input("\r");
                  return;
                }

                console_write(
                  "\r\nListing files in GitHub Cloud Storage...\r\n"
                );

                try {
                  const files = await githubListFiles();
                  if (files.length === 0) {
                    console_write("No files found.\r\n");
                  } else {
                    files.forEach((file) => {
                      console_write("  " + file + "\r\n");
                    });
                    console_write(
                      "\r\nTotal: " + files.length + " files (FREE storage)\r\n"
                    );
                  }
                } catch (error) {
                  console_write("Error: " + error.message + "\r\n");
                }

                inputBuffer = "";
                os.key_input("\r");
                return;
              }

              if (!pythonMode && command.startsWith("git-delete ")) {
                const filename = command.substring(11).trim();

                if (!filename) {
                  console_write("\r\nUsage: git-delete <filename>\r\n");
                  inputBuffer = "";
                  os.key_input("\r");
                  return;
                }

                if (!githubStorageReady) {
                  console_write(
                    "\r\n⚠ GitHub Cloud Storage not configured\r\n"
                  );
                  inputBuffer = "";
                  os.key_input("\r");
                  return;
                }

                console_write("\r\nDeleting from GitHub...\r\n");

                try {
                  await githubDeleteFile(filename);
                  console_write("✓ File deleted from GitHub Cloud Storage\r\n");
                } catch (error) {
                  console_write("Error: " + error.message + "\r\n");
                }

                inputBuffer = "";
                os.key_input("\r");
                return;
              }

              // Add help command for cloud storage features
              // System commands
              if (!pythonMode && command === "restart") {
                console_write("\r\n🔄 Reloading system...\r\n");
                setTimeout(() => window.location.reload(), 500);
                return;
              }

              if (!pythonMode && command === "meminfo") {
                console_write("\r\n=== System Memory Status ===\r\n");
                if (performance.memory) {
                  const used = (
                    performance.memory.usedJSHeapSize / 1048576
                  ).toFixed(2);
                  const total = (
                    performance.memory.jsHeapSizeLimit / 1048576
                  ).toFixed(2);
                  const percent = (
                    (performance.memory.usedJSHeapSize /
                      performance.memory.jsHeapSizeLimit) *
                    100
                  ).toFixed(1);
                  console_write(
                    "Memory Used: " +
                      used +
                      " MB / " +
                      total +
                      " MB (" +
                      percent +
                      "%)\r\n"
                  );

                  if (percent > 80) {
                    console_write(
                      "\x1B[33m⚠ High memory usage! Consider restarting.\x1B[0m\r\n"
                    );
                  } else if (percent > 60) {
                    console_write(
                      "\x1B[33m⚠ Moderate memory usage.\x1B[0m\r\n"
                    );
                  } else {
                    console_write(
                      "\x1B[32m✓ Memory usage is healthy.\x1B[0m\r\n"
                    );
                  }
                } else {
                  console_write(
                    "Memory monitoring not available in this browser.\r\n"
                  );
                  console_write(
                    "Try Chrome/Edge with --enable-precise-memory-info flag.\r\n"
                  );
                }
                console_write(
                  "\r\nTip: Use 'restart' command or press Ctrl+R to reload\r\n"
                );
                inputBuffer = "";
                os.key_input("\r");
                return;
              }

              if (!pythonMode && command === "help-storage") {
                console_write(
                  "\r\n=== GitHub Cloud Storage Commands (FREE - up to 5GB) ===\r\n"
                );
                console_write("git-upload <file>    Upload file to GitHub\r\n");
                console_write(
                  "git-download <file>  Download file from GitHub\r\n"
                );
                console_write(
                  "git-list             List all files in GitHub\r\n"
                );
                console_write(
                  "git-delete <file>    Delete file from GitHub\r\n"
                );
                console_write(
                  "\r\n=== Local Storage Commands (10MB limit) ===\r\n"
                );
                console_write(
                  "upload               Upload file from computer\r\n"
                );
                console_write(
                  "download <file>      Download file to computer\r\n"
                );
                console_write(
                  "\r\nSetup: To enable write access, set GITHUB_TOKEN\r\n"
                );
                console_write(
                  "in index.html with a Personal Access Token.\r\n"
                );
                console_write("\r\n=== Network Commands ===\r\n");
                console_write("curl <url>          Fetch data from URL\r\n");
                console_write("wget <url>          Fetch data from URL\r\n");
                console_write("\r\n=== System Commands ===\r\n");
                console_write("restart             Reload the system\r\n");
                console_write("meminfo             Show memory status\r\n");
                console_write("\r\n=== Python ===\r\n");
                console_write("python              Enter Python 3.13 REPL\r\n");
                console_write("  storage.save_file(), storage.load_file()\r\n");
                console_write(
                  "  storage.list_files(), storage.delete_file()\r\n"
                );
                console_write("\r\n");

                inputBuffer = "";
                os.key_input("\r");
                return;
              }

              // If in Python mode
              if (pythonMode) {
                const command = pythonBuffer.replace(/\r/g, "").trim();

                // Check for exit commands
                if (
                  command === "exit()" ||
                  command === "quit()" ||
                  command === "exit" ||
                  command === "quit" ||
                  data === "\x04"
                ) {
                  // Ctrl+D or exit commands
                  pythonMode = false;
                  pythonBuffer = "";
                  console_write("\r\nExiting Python...\r\n");
                  os.key_input("\r"); // Send enter to get new prompt
                  return;
                }

                // Execute Python code
                if (command) {
                  const output = await executePython(command);
                  if (output) {
                    console_write("\r\n" + output);
                  }
                }

                pythonBuffer = "";
                console_write("\r\n>>> ");
                return; // Don't send to Linux
              }

              inputBuffer = "";
            }

            // In Python mode, echo characters but don't send to Linux
            if (pythonMode) {
              if (data === "\x7f" || data === "\b") {
                // Backspace
                if (pythonBuffer.length > 0) {
                  pythonBuffer = pythonBuffer.slice(0, -1);
                  console_write("\b \b");
                }
              } else if (data !== "\r" && data !== "\n") {
                console_write(data);
              }
              return;
            }

            // Normal Linux mode - send input to Linux shell
            // (python command was already intercepted above if needed)
            os.key_input(data);
          });
        } catch (error) {
          log(
            "Linux/Wasm failed with (" +
              error.name +
              "): " +
              error.message +
              "\n" +
              error.stack
          );
          throw error;
        }
      },
      false
    );
  </script>
</head>
